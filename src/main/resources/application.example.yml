spring:
  application:
    name: sentinel
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  sentinel:
    security:
      jwt:
        secret: ${JWT_SECRET}
        expiration-minutes: 60
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}